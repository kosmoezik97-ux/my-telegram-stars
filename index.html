
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px;
  background: var(--tg-theme-bg-color, #101820);
  color: var(--tg-theme-text-color, white);
  font-family: Arial, sans-serif;
}
h1 { font-size: 27px; }
.card {
  background: var(--tg-theme-secondary-bg-color, #202e3a);
  padding: 22px;
  border-radius: 18px;
  margin: 18px 0;
}
.balance {
  font-size: 36px;
  color: #ffc94d;
  font-weight: bold;
}
button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: 0;
  border-radius: 13px;
  background: #2787e8;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
button:disabled { opacity: .6; }
#status { font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<h1>⭐ Stars App</h1>
<p>Добро пожаловать!</p>

<div class="card">
  <p>Твой баланс</p>
  <div class="balance">⭐ <span id="balance">0</span></div>
  <p id="status">Подключаем профиль...</p>
</div>

<div class="card">
  <h3>🎁 Получить звёзды</h3>
  <p>Выбери способ получения бонусов:</p>
  <button id="dailyButton" onclick="daily()" disabled>
    🎁 Ежедневный бонус
  </button>
  <button onclick="invite()">👥 Пригласить друга</button>
</div>

<div class="card">
  <h3>👤 Мой профиль</h3>
  <p id="username">Пользователь Telegram</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const SUPABASE_URL = "https://exkwefcvxlotdmdizwwx.supabase.co";
const SUPABASE_KEY = "sb_publishable_ii-90QiuM0f07AWV1PpWJA_yVIgnh-N";

const FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/telegram-stars";

const user = tg.initDataUnsafe?.user;

if (user) {
  document.getElementById("username").textContent =
    user.first_name || "Пользователь";
}

async function loadProfile() {
  const status = document.getElementById("status");

  if (!tg.initData) {
    status.textContent = "Открой приложение через Telegram.";
    return;
  }

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({
        initData: tg.initData
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка подключения");
    }

    document.getElementById("balance").textContent =
      data.balance ?? 0;

    status.textContent = "Профиль подключён ✅";
    document.getElementById("dailyButton").disabled = false;

  } catch (error) {
    console.error(error);
    status.textContent =
      "Не удалось загрузить профиль. Проверь подключение.";
  }
}

function daily() {
  tg.showAlert(
    "Ежедневный бонус пока подключается. Начисление появится после настройки серверной проверки."
  );
}

function invite() {
  tg.showAlert("Реферальная система скоро появится!");
}

loadProfile();
</script>
</body>
</html>
