
<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px;
  background: var(--tg-theme-bg-color, #101820);
  color: var(--tg-theme-text-color, white);
  font-family: Arial, sans-serif;
}
h1 { font-size: 27px; }
.card {
  background: var(--tg-theme-secondary-bg-color, #202e3a);
  padding: 22px;
  border-radius: 18px;
  margin: 18px 0;
}
.balance {
  font-size: 36px;
  color: #ffc94d;
  font-weight: bold;
}
button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: 0;
  border-radius: 13px;
  background: #2787e8;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>⭐ Stars App</h1>
<p>Добро пожаловать!</p>

<div class="card">
  <p>Твой баланс</p>
  <div class="balance">
    ⭐ <span id="balance">0</span>
  </div>
</div>

<div class="card">
  <h3>🎁 Получить звёзды</h3>
  <p>Выбери способ получения бонусов:</p>
  <button onclick="daily()">🎁 Ежедневный бонус</button>
  <button onclick="invite()">👥 Пригласить друга</button>
</div>

<div class="card">
  <h3>👤 Мой профиль</h3>
  <p id="username">Пользователь Telegram</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let balance = 0;
let claimed = false;

const user = tg.initDataUnsafe?.user;
if (user) {
  document.getElementById("username").textContent =
    user.first_name || "Пользователь";
}

function daily() {
  if (claimed) {
    tg.showAlert("Ты уже получил бонус!");
    return;
  }
  balance += 5;
  claimed = true;
  document.getElementById("balance").textContent = balance;
  tg.showAlert("Ты получил 5 бонусных очков ⭐");
}

function invite() {
  tg.showAlert("Реферальная система скоро появится!");
}
</script>
</body>
</html>
